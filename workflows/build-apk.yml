name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Check uploaded project files
        shell: bash
        run: |
          mkdir -p build-evidence
          missing=0
          for file in settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/local-chat.keystore tools/build-android.sh; do
            if [ ! -s "$file" ]; then
              echo "Missing required project file: $file" | tee -a build-evidence/android-build.log
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Upload the complete v5.0 source at the repository root. Do not put it inside another folder." | tee -a build-evidence/android-build.log
            exit 1
          fi
          git rev-parse HEAD > build-evidence/commit.txt

      - name: Unit tests and real APK build
        id: android_build
        shell: bash
        run: bash tools/build-android.sh
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android build evidence"
            if [ -f build-evidence/apk.sha256 ]; then
              echo "Tests and APK build completed. See PrivateCharacterChat-debug."
              echo '```text'
              cat build-evidence/apk.sha256
              echo '```'
            else
              echo "No verified APK was produced. Actual compiler/build errors follow."
              echo '```text'
              if [ -f build-evidence/android-build.log ]; then
                grep -E '^e: |^error: |Unresolved reference|Type mismatch|What went wrong|Execution failed' build-evidence/android-build.log | tail -80 || true
                tail -220 build-evidence/android-build.log
              else
                echo "Build did not reach Gradle. Check the setup step above."
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-log
          path: |
            build-evidence/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload actual APK
        if: success() && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: PrivateCharacterChat-debug
          retention-days: 14
          compression-level: 0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
